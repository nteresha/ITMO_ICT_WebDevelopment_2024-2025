<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Заявки на гонку: {{ race.name }}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/admin.css' %}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #333;
            color: white;
            line-height: 1.6;
        }

        header {
            background-color: darkred;
            color: #fff;
            padding: 10px;
            text-align: center;
            font-size: 20px;
        }

        nav {
            text-align: center;
            margin-top: 10px;
        }

        nav a {
            background-color: #333;
            color: white;
            padding: 8px 15px;
            font-size: 16px;
            border-radius: 5px;
            text-decoration: none;
            margin: 0 5px;
            display: inline-block;
        }

        nav a:hover {
            background-color: #555;
        }

        .applications {
            width: 90%;
            margin: 2rem auto;
            background: white;
            color: black;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table th, .table td {
            padding: 10px;
            text-align: left;
            border-bottom: 2px solid darkred;
        }

        .table th {
            background-color: darkred;
            color: white;
        }

        .table tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .table tr:hover {
            background-color: #ddd;
        }

        .btn-primary {
            background-color: darkred;
            border: none;
            color: white;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-primary:hover {
            background-color: #555;
        }

        .form-select {
            padding: 5px;
            border-radius: 5px;
            border: 1px solid darkred;
            background-color: white;
            color: black;
        }

    </style>
</head>
<body>
    <header>
        <h2>Заявки на гонку: {{ race.name }}</h2>
        <nav>
            <a href="{% url 'all_races' %}">Главная</a>
            <a href="{% url 'logout' %}">Выйти</a>
        </nav>
    </header>
    <section class="applications">
        <div class="container">
            <table class="table">
                <thead>
                    <tr>
                        <th>Гонщик</th>
                        <th>Статус</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody>
                    {% for registration in registrations %}
                    <tr>
                        <td>{{ registration.racer.full_name }}</td>
                        <td>{{ registration.get_status_display }}</td>
                        <td>
                            <form method="POST">
                                {% csrf_token %}
                                <input type="hidden" name="registration_id" value="{{ registration.id }}">
                                <select name="status" class="form-select" required>
                                    <option value="pending" {% if registration.status == 'pending' %}selected{% endif %}>Ожидает подтверждения</option>
                                    <option value="approved" {% if registration.status == 'approved' %}selected{% endif %}>Подтверждена</option>
                                    <option value="rejected" {% if registration.status == 'rejected' %}selected{% endif %}>Отклонена</option>
                                </select>
                                <button type="submit" class="btn btn-primary mt-2">Изменить статус</button>
                            </form>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="3">Заявок на участие нет.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </section>
</body>
</html>
